import org.yaml.snakeyaml.Yaml

buildscript {
	repositories { mavenCentral() }
	dependencies {
		classpath 'org.yaml:snakeyaml:2.4'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '3.3.2'
	id 'org.liquibase.gradle' version '2.2.2'
}

group = 'com.biolab'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(24)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
	set('springCloudVersion', "2025.0.0")
	set('springModulithVersion', "1.4.3")

	def ds = new Yaml()
			.load(file('src/main/resources/application.yml').text)
			.spring.datasource

	dbUrl      = ds.url      as String
	dbUser     = ds.username as String
	dbPassword = ds.password as String
	dbName     = dbUrl.tokenize('/').last()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-hateoas'
	implementation 'org.springframework.boot:spring-boot-starter-integration'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
	implementation 'org.apache.kafka:kafka-streams'
	implementation 'org.liquibase:liquibase-core'
	implementation 'org.springframework.data:spring-data-rest-hal-explorer'
	implementation 'org.springframework.integration:spring-integration-http'
	implementation 'org.springframework.integration:spring-integration-jdbc'
	implementation 'org.springframework.integration:spring-integration-kafka'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.modulith:spring-modulith-events-api'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
	implementation 'org.springframework.session:spring-session-jdbc'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
	runtimeOnly 'org.springframework.modulith:spring-modulith-events-kafka'
	runtimeOnly 'org.springframework.modulith:spring-modulith-observability'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
	testImplementation 'org.springframework.graphql:spring-graphql-test'
	testImplementation 'org.springframework.integration:spring-integration-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:kafka'
	testImplementation 'org.testcontainers:postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	liquibaseRuntime 'org.liquibase:liquibase-core:4.31.1'
	liquibaseRuntime 'org.liquibase:liquibase-commercial:4.31.1'
	liquibaseRuntime 'org.postgresql:postgresql:42.7.7'
	liquibaseRuntime 'org.yaml:snakeyaml:2.4'
	liquibaseRuntime 'info.picocli:picocli:4.7.6'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('bootBuildImage') {
	runImage = 'paketobuildpacks/ubuntu-noble-run-base:latest'
}

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
	testLogging {
		events "started", "passed", "skipped", "failed"
	}
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}

tasks.register('initDB', Exec) {
	group = 'db'
	workingDir 'src/main/resources/db/scripts/'
	//on linux
	commandLine './initialize-db.sh'
	environment 'DB_NAME', dbName
	environment 'DB_USER', dbUser
	environment 'DB_PASSWORD', dbPassword
}

tasks.register('dropDB', Exec) {
	group = 'db'
	workingDir 'src/main/resources/db/scripts/'
	//on linux
	commandLine './drop-db.sh'
	environment 'DB_NAME', dbName
	environment 'DB_USER', dbUser
}

liquibase {
	activities {
		main {
			url               dbUrl
			username          dbUser
			password          dbPassword
			changelogFile     'db/changelog/biolab.changelog.yml'
			searchPath        "${projectDir}/src/main/resources"
			defaultSchemaName dbName
			driver            'org.postgresql.Driver'
			logLevel          'severe'
		}
	}
	runList = 'main'
}

tasks.named('initDB') { mustRunAfter 'dropDB' }
tasks.named('update')  { mustRunAfter 'initDB' }

tasks.register('seedDB', Exec) {
	group = 'db'
	description = 'Reset the database and populate it with demo seed data'
	dependsOn 'dropDB', 'initDB', 'update'
	workingDir 'src/main/resources/db/scripts/'
	commandLine './seed-demo-db.sh'
	environment 'DB_NAME', dbName
	environment 'DB_USER', dbUser
	environment 'DB_PASSWORD', dbPassword
}

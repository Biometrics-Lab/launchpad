plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '3.3.2'
	id 'org.liquibase.gradle' version '2.2.2'
}

group = 'com.biolab'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(24)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
	set('springCloudVersion', "2025.0.0")
	set('springModulithVersion', "1.4.3")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-hateoas'
	implementation 'org.springframework.boot:spring-boot-starter-integration'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
	implementation 'org.apache.kafka:kafka-streams'
	implementation 'org.liquibase:liquibase-core'
	implementation 'org.springframework.data:spring-data-rest-hal-explorer'
	implementation 'org.springframework.integration:spring-integration-http'
	implementation 'org.springframework.integration:spring-integration-jdbc'
	implementation 'org.springframework.integration:spring-integration-kafka'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.modulith:spring-modulith-events-api'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
	implementation 'org.springframework.session:spring-session-jdbc'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
	runtimeOnly 'org.springframework.modulith:spring-modulith-events-kafka'
	runtimeOnly 'org.springframework.modulith:spring-modulith-observability'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
	testImplementation 'org.springframework.graphql:spring-graphql-test'
	testImplementation 'org.springframework.integration:spring-integration-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:kafka'
	testImplementation 'org.testcontainers:postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	liquibaseRuntime 'org.liquibase:liquibase-core:4.31.1'
	liquibaseRuntime 'org.postgresql:postgresql:42.7.7'
	liquibaseRuntime 'org.yaml:snakeyaml:2.4'
	liquibaseRuntime 'info.picocli:picocli:4.7.6'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('bootBuildImage') {
	runImage = 'paketobuildpacks/ubuntu-noble-run-base:latest'
}

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
	testLogging {
		events "started", "passed", "skipped", "failed"
	}
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}

tasks.register('initDB', Exec) {
	group = 'db'
	workingDir 'src/main/resources/db/scripts/'
	//on linux
	commandLine './initialize-db.sh'
}

tasks.register('dropDB', Exec) {
	group = 'db'
	workingDir 'src/main/resources/db/scripts/'
	//on linux
	commandLine './drop-db.sh'
}

liquibase {
	activities {
		main {
			url               'jdbc:postgresql://localhost:5432/biolab'
			username          'biolab'
			password          'biolab'
			changelogFile     'db/changelog/biolab.changelog.yml'
			searchPath        "${projectDir}/src/main/resources"
			defaultSchemaName 'biolab'
			driver            'org.postgresql.Driver'
		}
	}
	runList = 'main'
}

// Drops the local biolab DB — terminates active connections first, uses IF EXISTS so it's safe on a clean machine
tasks.register('dropDBLocal', Exec) {
	group = 'db'
	description = 'Drop the local biolab database'
	commandLine 'bash', '-c', '''
		psql -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'biolab' AND pid <> pg_backend_pid();" 2>/dev/null || true
		psql -d postgres -c "DROP DATABASE IF EXISTS biolab;" 2>/dev/null || true
		psql -d postgres -c "DROP ROLE IF EXISTS biolab;" 2>/dev/null || true
	'''
	ignoreExitValue = true
}

// Creates the DB, user, and schema using the existing init SQL scripts
tasks.register('initDBLocal', Exec) {
	group = 'db'
	description = 'Create local biolab database, user, and schema'
	dependsOn 'dropDBLocal'
	workingDir 'src/main/resources/db/scripts'
	commandLine 'bash', '-c',
		'psql -d postgres -f initalize-db.sql && psql -U biolab -d biolab -f initalize-db-scheme.sql'
}

// Liquibase 'update' must run after the DB is created
tasks.named('update') {
	mustRunAfter 'initDBLocal'
}

// Drop → init → Liquibase migrations → seed dev data
tasks.register('seedDB') {
	group = 'db'
	description = 'Reset the local database and populate it with development seed data'
	dependsOn 'initDBLocal', 'update'
	doLast {
		exec {
			commandLine 'psql', '-U', 'biolab', '-d', 'biolab',
				'-f', "${projectDir}/src/test/resources/db/seed-data.sql"
		}
	}
}

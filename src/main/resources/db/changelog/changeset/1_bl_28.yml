databaseChangeLog:
  - changeSet:
      id: create-spring-session
      author: viktor
      changes:
        - createTable:
            tableName: SPRING_SESSION
            columns:
              - column:
                  name: PRIMARY_ID
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: SESSION_ID
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: CREATION_TIME
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: LAST_ACCESS_TIME
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: MAX_INACTIVE_INTERVAL
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: EXPIRY_TIME
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: PRINCIPAL_NAME
                  type: VARCHAR(100)

        - createTable:
            tableName: SPRING_SESSION_ATTRIBUTES
            columns:
              - column:
                  name: SESSION_PRIMARY_ID
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: ATTRIBUTE_NAME
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: ATTRIBUTE_BYTES
                  type: BYTEA
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: SPRING_SESSION_ATTRIBUTES
            baseColumnNames: SESSION_PRIMARY_ID
            referencedTableName: SPRING_SESSION
            referencedColumnNames: PRIMARY_ID
            constraintName: FK_SESSION_ATTRIBUTES
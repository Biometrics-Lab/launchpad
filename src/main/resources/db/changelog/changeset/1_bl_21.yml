databaseChangeLog:
  - changeSet:
      id: 1-BL-21-1
      author: viktor.badovskyi
      changes:
        - createTable:
            tableName: measurement
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
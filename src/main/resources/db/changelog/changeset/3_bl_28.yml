databaseChangeLog:
  - changeSet:
      id: 3-BL-28-1
      author: roman.vakulenko
      changes:
        - createTable:
            tableName: event_publication
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: listener_id
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: serialized_event
                  type: varchar(2000)
                  constraints:
                    nullable: false
              - column:
                  name: publication_date
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: completion_date
                  type: timestamp with time zone
                  constraints:
                    nullable: true
